spring:
  application:
    name: learning-openshift
  profiles:
    active: local
  output:
    ansi:
      enabled: always
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:openshift_db}
    username: ${POSTGRES_USER:openshift}
    password: ${POSTGRES_PASSWORD:openshift}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OpenshiftHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: initial
    table: flyway_schema_history

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,beans
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    info:
      access: read-only
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  info:
    git:
      mode: full
    build:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,1s,2s,5s

info:
  app:
    name: ${spring.application.name}
    description: Spring Boot Book CRUD microservice — vehicle for learning OpenShift (Routes, Projects, DeploymentConfig, BuildConfig, ImageStream, SCC, Templates)
    version: 0.0.1-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.org.openshift: DEBUG
    org.hibernate.SQL: WARN
