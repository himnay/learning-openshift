# HorizontalPodAutoscaler — standard k8s object (autoscaling/v2), identical API on
# OpenShift and EKS. Requires the metrics-server (or OpenShift's built-in equivalent,
# wired into cluster monitoring by default) to supply the resource metrics.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: learning-openshift-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: learning-openshift
  minReplicas: 2
  # Capped at 4, not higher: at this Deployment's per-pod limits (cpu: "1", memory: 768Mi
  # in deployment.yaml), 4 replicas exactly saturates this namespace's ResourceQuota
  # (limits.cpu: "4", limits.memory: 4Gi in resourcequota.yaml). Raising this without
  # raising the quota causes pod admission failures once the HPA tries to scale past it —
  # keep the two in lockstep if either changes.
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
