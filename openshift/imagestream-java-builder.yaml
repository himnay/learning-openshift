# Imports Red Hat's OpenJDK Source-to-Image (S2I) builder image into the project's own
# ImageStream namespace. The S2I BuildConfig (buildconfig-s2i.yaml) builds FROM this —
# it is the "from" side of `strategy.sourceStrategy.from` there.
#
# Red Hat ships UBI OpenJDK images for LTS releases only (…, 17, 21, 25): there is no
# ubi9/openjdk-27, so this builder compiles and runs the app as Java 25 bytecode (see the
# MAVEN_ARGS_APPEND in buildconfig-s2i.yaml). The Docker strategy (buildconfig-docker.yaml)
# is the Java 27 path.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: openjdk-25-ubi9
  labels:
    app: learning-openshift
spec:
  tags:
    - name: latest
      from:
        kind: DockerImage
        name: registry.access.redhat.com/ubi9/openjdk-25:latest
      importPolicy:
        scheduled: true
      referencePolicy:
        type: Local
